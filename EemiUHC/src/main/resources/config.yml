# EemiUHC - UHC Run d'EEMICRAFT
# Monde de jeu cree a chaque partie (graine aleatoire) et supprime a la fin.
world-name: uhc
# Parties en meme temps : partie 1 dans le monde world-name, partie n dans world-name_n (uhc_2, uhc_3)
max-instances: 3
hub-world: lobby

# Modes proposes (taille des equipes) : solo 1, duo 2, trio 3
modes: [solo, duo, trio]
min-players: 2
max-players: 10
# Decompte quand une file atteint le minimum (10 s si elle est pleine)
countdown: 30

# Deroulement (en secondes depuis le debut)
invincibility: 10       # aucun dégât au début
final-heal: 540         # tout le monde soigne (9:00)
pvp-time: 600           # PvP actif (10:00)
border-start: 1000      # taille de départ (1000 x 1000)
border-shrink-start: 600
border-shrink-time: 600 # 1000 -> border-end en 10 min (10:00 -> 20:00)
border-end: 50
meetup-time: 1200       # 20:00 : tout le monde en surbrillance (Glowing)
final-shrink-time: 1500 # 25:00 : bordure 50 -> final-border en 2 min
final-shrink-duration: 120
final-border: 10
max-time: 2100          # 35:00 : fin de partie, l'équipe avec le plus de vivants (puis de kills) gagne
end-time: 10            # secondes avant le retour au hub

# Minage accelere : niveau de Celerite (Haste) permanent, 0 = aucun
haste-level: 1
# Teleportation de depart : distance minimale entre deux equipes
spread-min-distance: 150

# Cut clean et pommes
apple-chance: 0.03      # chance qu'une feuille cassee ou qui se decompose donne une pomme

# Scenarios
scenarios:
  timber: true
  hastey-boys: true     # outils fabriques : Efficacite III + Solidite III
  starter-kit: true     # pioche en pierre, 16 steaks, 3 livres

# Tete d'or (8 lingots d'or autour d'une tete de joueur) : Regeneration II et Absorption
golden-head:
  regen-seconds: 10
  absorption-seconds: 120

# 1.3 (demandes de Thibault) : regeneration naturelle jusqu'a regen-until secondes (defaut = final-heal,
# 0 = jamais) ; limite d'apparition des monstres du monde (vanilla 70) ; minerais multiplies au minage.
regen-until: 540
monster-spawn-limit: 25
ore-multiplier: 2
