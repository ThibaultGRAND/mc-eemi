# Monde de l'arbre (le lobby)
world: lobby
# Les animations ne tournent que si un joueur est a moins de ce rayon (blocs) de l'arbre
radius: 40
# Temps entre deux animations d'un meme createur, en ticks (20 = 1 s), tire au hasard
interval-min: 60
interval-max: 160
# Distance (blocs) de la petite course devant soi : attention au bord des branches
run-distance: 1.2
# Volume des petits sons (1.0 = normal)
sound-volume: 0.4

# Un createur par pseudo : skin et nom affiche = le pseudo. yaw = direction du regard au repos
# (0 = sud, 90 = ouest, 180 = nord, -90 = est). /createurs pos <pseudo> en jeu pour le placer ici.
