# EemiSkyWars - SkyWars d'EEMICRAFT (solo) multi-map (une map tiree au hasard a chaque partie).
# Regles d'apres le SkyWars d'Hypixel : chaque joueur part de son ile (attente dans la cage de la map),
# coffres d'ile / d'ilots / du centre (meilleur loot au centre), tous les blocs se cassent et se posent,
# deux remplissages des coffres (le 2e ajoute des perles de l'Ender), puis « Doom » et fin a egalite.
# Toute la map est remise en etat a la fin de chaque partie.

hub-world: lobby

# Parties en meme temps. Partie 1 = monde d'origine de la map, partie n = copie « monde_n » faite depuis
# « monde_modele » (ex. skywars_2, sw_twister_3), supprimee quand elle ne sert plus.
max-instances: 3

min-players: 2
countdown: 30
full-countdown: 10
# Temps sans degats de chute apres l'ouverture des cages (la cage est a ~11 blocs au-dessus de l'ile).
no-fall-time: 6

# Deroulement (secondes apres l'ouverture des cages) - comme Hypixel : remplissages, Doom, fin.
refill-1: 300
refill-2: 600
doom: 900
# Doom : duree du resserrement de la bordure (taille finale : doom-border-size de la map).
doom-shrink-time: 180
game-end: 1200
end-time: 10

# Aide a l'ajout de map (/skywars scanchests) : rayon du scan autour du centre, coffres a moins de
# scan-center-radius du centre = « center », a moins de scan-island-radius d'une cage = « island », sinon « mid ».
scan-radius: 150
scan-center-radius: 20
scan-island-radius: 15

# Kits au choix (objet « Choisir un kit » pendant l'attente), ajoutes a l'inventaire a l'ouverture des cages.
# items : « MATERIAL quantite », enchantements « MATERIAL:ENCHANT:NIVEAU[:ENCHANT:NIVEAU] quantite »,
# potions « POTION:TYPE quantite » (SPLASH_POTION, LINGERING_POTION aussi). effects : « EFFET secondes niveau ».
# permission (optionnelle) : kit utilisable seulement avec cette permission (deverrouillage EemiCore).
default-kit: defaut
kits:
  defaut:
    name: Défaut
    icon: WOODEN_SWORD
    description: [ "Une épée en bois pour commencer." ]
    items: [ "WOODEN_SWORD 1" ]
  archer:
    name: Archer
    icon: BOW
    description: [ "Un arc et 8 flèches." ]
    items: [ "BOW 1", "ARROW 8" ]
  batisseur:
    name: Bâtisseur
    icon: OAK_PLANKS
    description: [ "64 planches et une pioche en pierre", "pour filer vers le centre." ]
    items: [ "OAK_PLANKS 64", "STONE_PICKAXE 1" ]
  fermier:
    name: Fermier
    icon: EGG
    description: [ "16 œufs et une pomme d'or." ]
    items: [ "EGG 16", "GOLDEN_APPLE 1" ]
  enchanteur:
    name: Enchanteur
    icon: EXPERIENCE_BOTTLE
    description: [ "16 fioles d'expérience." ]
    items: [ "EXPERIENCE_BOTTLE 16" ]
  pyro:
    name: Pyro
    icon: FLINT_AND_STEEL
    description: [ "Un briquet et un seau de lave." ]
    items: [ "FLINT_AND_STEEL 1", "LAVA_BUCKET 1" ]
  tank:
    name: Tank
    icon: LEATHER_CHESTPLATE
    description: [ "Un plastron en cuir Protection I." ]
    items: [ "LEATHER_CHESTPLATE:protection:1 1" ]

# Maps (une tiree au hasard a chaque partie, jamais deux fois de suite la meme ; /skywars map <id> pour forcer).
#   center : centre de la map (ile centrale) et point des spectateurs ; border-center x,z et border-size :
#   bordure de la partie ; doom-border-size : taille finale au Doom ; void-y : on meurt en dessous.
#   cages : « x,z » (plancher de verre en cage-floor-y) ou « x,y,z » (y = plancher de verre, comme /skywars addcage).
#   chests : « x y z type » (island = ile de depart, mid = ilots, center = ile centrale).
# Nouvelle map : /skywars editmap <id> [monde], /skywars setcenter, /skywars addcage (dans chaque cage),
# /skywars scanchests [rayon] ; le plugin enregistre tout ici.
