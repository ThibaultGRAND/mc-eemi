# EemiMurder - Murder Mystery d'EEMICRAFT
# Les positions s'ecrivent "x,y,z" (ou "x,y,z,yaw,pitch").

# Lobby d'attente (monde murder, salle EEMI) et monde ou renvoyer les joueurs qui quittent.
lobby: 'murder,120.5,-60,-119.5,180,0'
hub-world: lobby

# Parties en meme temps (1 = monde d'origine de la map, n >= 2 = copie <monde>_n faite depuis <monde>_modele).
# Le salon d'attente reste commun a toutes les parties.
max-instances: 3
min-players: 3
max-players: 16
# Compte a rebours quand le minimum est atteint, raccourci quand la partie est pleine.
countdown: 30
full-countdown: 10
# Duree d'une partie (secondes) : a la fin du temps, les innocents gagnent.
game-time: 270
# Le meurtrier recoit son epee apres ce delai.
sword-delay: 10
# Delai minimum entre deux kills du meurtrier au couteau (secondes) : pendant ce delai le coup ne fait rien.
kill-cooldown: 3
# Or : une piece toutes les N secondes sur la map (au plus gold-max au sol), gold-for-bow pieces = un arc.
gold-interval: 3
gold-max: 12
gold-for-bow: 10
# Delai avant de recuperer une fleche apres un tir.
arrow-cooldown: 5
# Fin de partie : temps avant le retour au lobby d'attente.
end-time: 8

