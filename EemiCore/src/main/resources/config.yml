# EemiCore : registre des jeux, appels a la partie, groupes, progression (niveaux, pieces),
# boutique de cosmetiques, quetes du jour, classements et placeholders PlaceholderAPI (%eemi_...%).
# Textes joueurs avec accents (fichier en UTF-8), commentaires sans. Couleurs avec &.

# Monde du hub : appels, cosmetiques et groupes ne s'y appliquent que la.
lobby-world: lobby

# DA des menus (profil, boutique, quetes, groupe, classements) : fonds dessines et icones du pack de textures.
# A activer SEULEMENT quand le pack qui contient LobbyUI est en ligne (sinon carres vides et icones violettes).
lobby-ui:
  enabled: false
  # 1.6.0 : modeles eemicraft:gadget/<feux|peinture|grappin|jetpack> sur les gadgets (seulement si enabled est true).
  gadget-models: true

# Statut recu d'un jeu maison oublie apres ce delai sans nouvelle (minutes) -> retour a "inconnu".
status-expire-minutes: 10

# Appels a la partie : toutes les call-interval secondes, si un jeu attend avec moins de "min" joueurs.
call-interval: 60

# Sauvegarde des donnees joueurs (secondes).
save-interval: 60

# Jeux tires au hasard par /jouer quand aucun jeu n'a de joueurs en attente.
random-games: [bedwars, skywars, hungergames, thebridge, murder, blockparty, hideseek, tnttag, sheepwars, tonte, tntrun]

# Textes du statut (%eemi_status_<jeu>%). %waiting% %playing% %max% %players%
status-text:
  waiting: "&a%waiting%/%max% en attente"
  starting: "&eDemarrage..."
  playing: "&cEn partie (%playing%)"
  ending: "&6Fin de partie"
  nobody: "&7Aucun joueur"
  deduced: "&7%players% joueurs"
  deduced-one: "&71 joueur"
  # Jeu ferme par /eemi maintenance (remplace le statut).
  maintenance: "&8Maintenance"

# Fichier plugins/EemiCore/status.json lu par le bot Discord et le site (interval en secondes).
# Aussi reecrit au demarrage et a chaque /eemi maintenance on|off.
status-file:
  enabled: true
  interval: 30

# Registre des jeux.
# join : commande executee PAR LE JOUEUR ; prefixe "console:" = commande console (%player% = pseudo).
# spectate : commande joueur pour regarder une partie (vide = pas de mode spectateur).
# worlds : mondes du jeu (statut deduit pour les jeux tiers, bouton [SUIVRE] des groupes).
# multiplier : multiplicateur des gains (pieces et xp) pour ce jeu.
# join-aliases : autres commandes de join refusees quand le jeu est en maintenance (debut de commande,
# sans le /). Le join lui-meme (sans "console:") est deja bloque.
games:
  bedwars:
    name: "&cBedWars"
    icon: RED_BED
    join: "bw autojoin"
    join-aliases: [bw join, bedwars join, bw autojoin]
    spectate: ""
    worlds: [bw1, bw2, bw3, bw4, bw5, bw6, bw7, bw8]
    min: 2
    max: 8
  skywars:
    name: "&bSkyWars"
    icon: ENDER_EYE
    join: "skywars join"
    spectate: "skywars spectate"
    worlds: [skywars, sw_twister]
    min: 2
    max: 16
  hungergames:
    name: "&6Hunger Games"
    icon: BOW
    join: "hungergames join"
    spectate: "hungergames spectate"
    worlds: [hungergames, hg_altrac]
    min: 2
    max: 24
  uhc:
    name: "&eUHC Run"
    icon: GOLDEN_APPLE
    join: "console:dm open uhc %player%"
    spectate: "uhc spectate"
    worlds: [uhc]
    min: 2
    max: 10
  duels:
    name: "&cDuels"
    icon: DIAMOND_SWORD
    join: "duel"
    spectate: "duel spectate"
    worlds: [duels]
    min: 2
    max: 2
  ffa:
    name: "&4Arene FFA"
    icon: SPLASH_POTION
    join: "ffa"
    spectate: "ffa spectate"
    worlds: [duels]
    min: 2
    max: 50
  thebridge:
    name: "&9The Bridge"
    icon: BLUE_TERRACOTTA
    join: "bridge join"
    spectate: "bridge spectate"
    worlds: [thebridge]
    min: 2
    max: 8
  towers:
    name: "&cThe Towers"
    icon: LAPIS_BLOCK
    join: "towers join"
    spectate: "towers spectate"
    worlds: [thetowers]
    min: 2
    max: 16
  ballsofsteel:
    name: "&7Balls of Steel"
    icon: DIAMOND_ORE
    join: "ballsofsteel join"
    spectate: "ballsofsteel spectate"
    worlds: [ballsofsteel]
    min: 2
    max: 16
  murder:
    name: "&4Murder Mystery"
    icon: IRON_SWORD
    join: "murder join"
    spectate: "murder spectate"
    worlds: [murder]
    min: 3
    max: 16
  loupgarou:
    name: "&5Loup-Garou"
    icon: BONE
    join: "console:mv tp %player% lg"
    spectate: ""
    worlds: [lg]
    min: 4
    max: 20
  hideseek:
    name: "&6Cache-cache"
    icon: CARVED_PUMPKIN
    join: "hideseek join"
    spectate: "hideseek spectate"
    worlds: [hideseek]
    min: 3
    max: 20
  blockparty:
    name: "&dBlock Party"
    icon: NOTE_BLOCK
    join: "blockparty join"
    spectate: "blockparty spectate"
    worlds: [blockparty]
    min: 2
    max: 30
  buildbattle:
    name: "&aBuild Battle"
    icon: BRICKS
    join: "buildbattle join eemicraft"
    spectate: ""
    worlds: [buildbattle]
    min: 2
    max: 8
  bingo:
    name: "&aEEMINGO"
    icon: FILLED_MAP
    join: "console:dm open eemingo %player%"
    spectate: "bingo spectate"
    worlds: [eemingo, bingo]
    min: 2
    max: 16
  tntrun:
    name: "&cTNT Run"
    icon: TNT
    join: "tr join tntrun1"
    spectate: ""
    worlds: [tntrun]
    min: 2
    max: 24
  tnttag:
    name: "&cTNT Tag"
    icon: TNT_MINECART
    join: "tnttag join"
    spectate: "tnttag spectate"
    worlds: [tnttag]
    min: 3
    max: 20
  tntwars:
    name: "&cTNT Wars"
    icon: DISPENSER
    join: "tntwars join"
    spectate: "tntwars spectate"
    worlds: [tntwars]
    min: 2
    max: 16
  sheepwars:
    name: "&fSheep Wars"
    icon: WHITE_WOOL
    join: "sheepwars join"
    spectate: "sheepwars spectate"
    worlds: [sheepwars]
    min: 2
    max: 16
  tonte:
    name: "&eTonte Royale"
    icon: SHEARS
    join: "tonteroyale join"
    spectate: "tonteroyale spectate"
    worlds: [tonteroyale]
    min: 2
    max: 16

# Gains par type de recompense (eemi reward <pseudo> <jeu> <type>).
rewards:
  play: {coins: 5, xp: 20}
  win: {coins: 25, xp: 100}
  kill: {coins: 3, xp: 10}

# 1.6.0 : bonus de la premiere partie et de la premiere victoire de la journee (heure de Paris), en pieces. 0 = coupe.
daily-bonus:
  first-play: 15
  first-win: 50

# 1.6.0 : recompense de la premiere connexion de la journee (heure de Paris). coins[n-1] = jour n de la serie
# de jours consecutifs ; apres le dernier palier on reste au max ; un jour manque remet la serie a 1.
daily-reward:
  enabled: true
  coins: [20, 25, 30, 35, 40, 45, 50]

# 1.6.0 : fuseau horaire de la journee (recompense du jour, bonus du jour).
timezone: "Europe/Paris"

# 1.6.0 : ligne cliquable a la connexion [Quetes x/3] [Jouer] [Boutique].
join-links:
  enabled: true

# 1.6.0 : boutique. Un achat au-dessus de ce prix passe par un ecran Oui / Annuler.
shop:
  confirm-above: 500

# 1.6.0 : sons d'interface (cle du pack de textures ; "" = aucun son).
sounds:
  achat: "eemicraft:ui.achat"
  quete: "eemicraft:ui.quete"
  niveau: "eemicraft:ui.niveau"
  recompense: "eemicraft:ui.recompense"
  erreur: "eemicraft:ui.erreur"

# Niveaux : xp pour passer le niveau n = base + step * (n - 1). Bonus de pieces = level-up-coins * nouveau niveau.
levels:
  base: 100
  step: 50
  level-up-coins: 10

# Chat : [Niv N] [titre] Pseudo: message
chat:
  enabled: true
  # Mondes ou le format n'est pas touche (Murder cache les pseudos).
  disabled-worlds: [murder]
  # Couleur du niveau par palier (niveau minimum: couleur).
  level-colors:
    1: "&7"
    5: "&f"
    10: "&a"
    20: "&b"
    30: "&9"
    40: "&d"
    50: "&6"
    75: "&c"
    100: "&4"

# Titre equipe affiche au-dessus du pseudo au hub (hauteur depuis les pieds).
title-tag:
  enabled: true
  height: 2.55
# Case de la barre d'objets ou le gadget equipe est donne au hub (DeluxeHub utilise 0, 2, 4, 6, 8).
gadget-slot: 7
# Le jetpack s'arrete au-dessus de cette hauteur.
jetpack-max-y: 120
# Hors du hub, personne ne vole en survie/aventure (le double saut de DeluxeHub donnait le vol en FFA),
# sauf dans ces mondes (double saut de TNT Run et du Cache-cache) et en vanish.
flight-worlds: [tntrun, hideseek]

