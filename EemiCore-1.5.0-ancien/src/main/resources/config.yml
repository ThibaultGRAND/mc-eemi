    icon: DIAMOND_ORE
    join: "ballsofsteel join"
    spectate: "ballsofsteel spectate"
    worlds: [ballsofsteel]
    min: 2
    max: 16
  murder:
    name: "&4Murder Mystery"
    icon: IRON_SWORD
    join: "murder join"
    spectate: "murder spectate"
    worlds: [murder]
    min: 3
    max: 16
  loupgarou:
    name: "&5Loup-Garou"
    icon: BONE
    join: "console:mv tp %player% lg"
    spectate: ""
    worlds: [lg]
    min: 4
    max: 20
  hideseek:
