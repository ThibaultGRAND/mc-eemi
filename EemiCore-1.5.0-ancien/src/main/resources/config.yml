# Quetes du jour : 3 tirees au hasard chaque jour (minuit, heure du serveur).
# type : play | win | kill ; game : any (tous les jeux), random (un jeu au hasard de random-games) ou un id.
# %game% = nom du jeu, %target% = objectif.
quests:
  count: 3
  pool:
    play3: {text: "Joue %target% parties", type: play, game: any, target: 3, coins: 30, xp: 60}
    play6: {text: "Joue %target% parties", type: play, game: any, target: 6, coins: 60, xp: 120}
    win1: {text: "Gagne 1 partie", type: win, game: any, target: 1, coins: 50, xp: 100}
    win3: {text: "Gagne %target% parties", type: win, game: any, target: 3, coins: 120, xp: 250}
    kill5: {text: "Fais %target% kills", type: kill, game: any, target: 5, coins: 40, xp: 80}
    kill15: {text: "Fais %target% kills", type: kill, game: any, target: 15, coins: 90, xp: 180}
    playgame: {text: "Joue a %game% %target% fois", type: play, game: random, target: 2, coins: 40, xp: 80}
    wingame: {text: "Gagne une partie de %game%", type: win, game: random, target: 1, coins: 80, xp: 160}

# 1.5 : groupes. Quand le chef entre dans une partie, les membres le suivent tout seuls (meme commande
# que lui, ex. « bw join lagoon »), sans cliquer sur [SUIVRE]. Jeux exclus (progression personnelle) :
party:
  auto-follow: true
  no-follow: [skyblock, oneblock, abysse]

# 1.5.3 : filet de securite du hub (tickets #50, #53). Au lobby seulement (pas tntrun / buildbattle), a l'arrivee,
# a la connexion et toutes les interval-ticks, on retire les objets marques (PDC) par un de ces plugins.
# Espaces de noms = nom du plugin en minuscules. eemicore et eemiadmin ne sont jamais retires.
lobby-guard:
  enabled: true
  interval-ticks: 100
  namespaces: [eemiabysse, eemiballsofsteel, eemibingo, eemiblockparty, eemiboatrace, eemibowspleef, eemibridge,
    eemibuildbattle, eemihideseek, eemihorscours, eemihungergames, eemijumpleague, eemimurder, eemipitchout,
    eemipvprun, eemisheepwars, eemiskywars, eemitnttag, eemitntwars, eemitonte, eemitowers, eemiuhc, eemiwizards]
