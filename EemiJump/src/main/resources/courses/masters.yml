# Parkour Masters (Nordic_Studios, CurseForge 1020454, fichier 5353095, monde 1.20.1 DataVersion 3465), licence MIT.
# Genere par gen_masters.py. Couloir droit vers -z, x -4..0 : 101 plateformes de planches (y -60, 3 de profondeur),
# une tous les 18 blocs (z = 8 - 18 n) ; plateforme 0 = depart, 100 = arrivee. La map d'origine a un second couloir
# identique en x 6..10 (mode sans checkpoint) : inutile ici, chaque niveau est deja un point de controle.
# point : [x, z, axe, debut, fin, yaw] ; axe z = plateforme centree sur z (+-1), de x debut a fin.
name: "Parkour Masters"
world: jump_masters
author: Nordic_Studios
credit: "Map Parkour Masters de Nordic_Studios, licence MIT"
difficulty: moyen
icon: bamboo
description: "100 niveaux courts dans un long couloir|Slime, echelles, glace, lave, feu, neo..."
floor-y: -59
# Sous le couloir : le vide. Les blocs les plus bas du parcours (slime, terre des grandes feuilles, echelles) sont en y -64.
fail-y: -64.5
# Toucher ces blocs = retour a la plateforme : la lave et le feu tuaient dans la map d'origine.
# La lave compte sur toute la boite du joueur. Les blocs de hazards-center (le feu) ne comptent que dans la colonne
# centrale du joueur (bloc des pieds et bloc au-dessus) : on peut frôler les flammes sans les traverser.
hazards: [lava, fire, soul_fire]
hazards-center: [fire, soul_fire]
# Mode « sans chute » : les 100 niveaux d'affilee, une chute = retour au niveau 1 (progression a part du mode normal).
# Recompense donnee une seule fois (marqueur courses.masters.nofall.bonus), pas le finish-bonus normal.
no-fall:
  enabled: true
  bonus:
    enabled: true
    version: 1
    coins: 2000
    xp: 2000
    cosmetics: [title_j_masters_hc, trail_j_hc]
    lines:
      - "&a&lTitre exclusif : &4&lSans Faute &7(/boutique > Titres)"
      - "&a&lTraînée exclusive : &eÉclats du totem &7(/boutique > Traînées)"
    menu-lines:
      - "&7+ titre &4&lSans Faute &7et traînée &eÉclats du totem"
# Boite (sortie = retour) : murs en x -5 et 1, dessus des murs en y -53 (pieds a -53 ou plus haut = hors parcours).
bounds: [-4, -70, -1794, 0, -54, 9]
# Retouches de la map, appliquees une fois par version (data.yml patched.masters). Ligne : "x y z etat" ou boite "x1 y1 z1 x2 y2 z2 etat".
# v1 (17/11/2026) : niveau 74 (de la plateforme z -1306 a z -1324) refait. L'original (5 demi-dalles d'1 bloc separees par
# 2 feux, au-dessus du vide) etait quasi impossible. Nouvelle epreuve « Braises » : 4 plots de pierre noire en zigzag
# (saut de 2, saut de 2 en montant d'1, diagonale, saut de 3 en descendant d'1, puis saut de 2 sur la plateforme),
# braseros de feu des ames contre les murs, lanternes des ames sous les plots.
patches:
  version: 1
  blocks:
    # ancienne epreuve retiree (bande de netherrack, demi-dalles, feu)
    - "-4 -60 -1322 0 -59 -1308 air"
    # plot 1 : z -1310, x -2, pieds a -59
    - "-2 -60 -1310 polished_blackstone_bricks"
    - "-2 -61 -1310 iron_chain[axis=y]"
    - "-2 -62 -1310 soul_lantern[hanging=true]"
    # plot 2 : z -1313, x -3, monte d'1 (pieds a -58), socle en dessous
    - "-3 -59 -1313 chiseled_polished_blackstone"
    - "-3 -60 -1313 polished_blackstone"
    - "-3 -61 -1313 polished_blackstone_wall"
    # plot 3 : z -1316, x -1, meme hauteur (pieds a -58)
    - "-1 -59 -1316 chiseled_polished_blackstone"
    - "-1 -60 -1316 polished_blackstone"
    - "-1 -61 -1316 polished_blackstone_wall"
    # plot 4 : z -1320, x -2, redescend (pieds a -59)
    - "-2 -60 -1320 polished_blackstone_bricks"
    - "-2 -61 -1320 iron_chain[axis=y]"
    - "-2 -62 -1320 soul_lantern[hanging=true]"
    # braseros contre les murs, loin de la trajectoire (feu des ames sur sable des ames)
    - "0 -60 -1312 soul_soil"
    - "0 -59 -1312 soul_fire"
    - "-4 -60 -1317 soul_soil"
    - "-4 -59 -1317 soul_fire"
# Recompense de fin propre a ce parcours (le titre « Maitre du Jump » reste a Overgrown).
finish-bonus:
  enabled: true
  version: 1
  coins: 600
  xp: 800
  cosmetics: [title_j_masters, trail_j_flammes]
  lines:
    - "&a&lTitre exclusif : &6&lParkour Master &7(/boutique > Titres)"
    - "&a&lTraînée exclusive : &6Gouttes de lave &7(/boutique > Traînées)"
