# EemiBingo - EEMINGO, le Bingo d'EEMICRAFT
# Chaque partie se joue dans un monde neuf (graine aleatoire) nomme "bingo", supprime a la fin.
# Jeu en EQUIPES. Le mode choisi fixe la taille des equipes : solo (1), duo (2), quatuor (4).
# Une file par mode ; les inscrits attendent dans le lobby EEMINGO. La file qui atteint min-players
# lance son decompte puis sa partie, meme si d'autres parties tournent (max-instances parties en meme temps).
# Equipes formees automatiquement et equilibrees (au moins 2 equipes des 2 joueurs, 8 au maximum).

world-name: bingo
# Parties en meme temps : partie 1 dans le monde world-name, partie n dans world-name_n (bingo_2, bingo_3)
max-instances: 3
hub-world: lobby
# Modes proposes (retirer un mode pour le desactiver).
modes: [solo, duo, quatuor]
# Joueurs minimum dans une file pour lancer le decompte, maximum par partie.
min-players: 2
max-players: 16
# Lobby d'attente : monde vide cree avec Multiverse, salle construite par /bingo buildlobby autour de ce point.
lobby-world: eemingo
lobby-center:
  x: 0
  y: 100
  z: 0
# Taille de la bordure du monde de jeu (blocs de cote, centree sur le point de depart choisi).
border: 400

# Compte a rebours (secondes) une fois min-players atteint ; ramene a 10 s si la file atteint max-players.
countdown: 30
# Duree max (secondes) : sans ligne complete, l'equipe qui a le plus d'items gagne.
game-time: 1200
end-time: 10

# Composition de la grille de 25 cases (le reste en moyen).
easy-count: 8
hard-count: 6

