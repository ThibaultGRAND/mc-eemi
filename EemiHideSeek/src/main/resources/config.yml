# EemiHideSeek - Cache-cache d'EEMICRAFT (facon Prop Hunt / Hide and Seek d'Hypixel).
# Les cacheurs sont invisibles et deguises en bloc : le deguisement suit le joueur, et s'il reste
# immobile quelques secondes il devient un vrai bloc (aligne sur la grille) pour les autres joueurs.
# Les chercheurs attendent aveugles pendant le temps de cachette, puis sont laches avec une epee.
# Cacheur trouve = il devient chercheur (ou spectateur, voir found-becomes).
# Si au moins un cacheur survit a la fin du temps, les cacheurs gagnent.

# Monde du jeu : cree vide par le plugin s'il n'existe pas, la map est construite par le plugin
# (au demarrage si elle manque ou si sa version change, et par /hideseek build).
world: hideseek
hub-world: lobby
# Parties en meme temps : partie 1 = monde ci-dessus, parties 2..n = copies <world>_2, <world>_3...
# faites depuis le modele <world>_modele (copie propre refaite au demarrage et apres /hideseek build).
max-instances: 3

# Joueurs : minimum pour lancer le decompte, maximum dans la salle d'attente.
min-players: 3
max-players: 20
# Decompte avant la partie (secondes).
countdown: 20
# Un chercheur pour ce nombre de joueurs (minimum 1 chercheur, au moins 1 cacheur).
players-per-seeker: 5
# Niveau de Vitesse des chercheurs une fois laches (1.2.3) : ils courent plus vite que les cacheurs. 0 = aucun.
seeker-speed: 2

# Temps de cachette (chercheurs aveugles et immobiles), puis temps de recherche (secondes).
hide-time: 30
game-time: 420
# Ecran de fin avant le retour en salle d'attente.
end-time: 8

# Immobilite necessaire pour devenir un bloc solide (secondes).
solid-delay: 3.5
# Changement de bloc : attente entre deux changements (secondes, pendant la recherche).
change-cooldown: 3
# Autoriser a copier n'importe quel bloc vise (false = seulement les blocs de la liste ci-dessous).
allow-any-target: false

# Coups des chercheurs : degats par coup (un cacheur a 20 PV), portee, attente entre deux coups.
hit-damage: 5.0
hit-range: 4.0
hit-cooldown-ms: 400
# Cacheur trouve : seeker (devient chercheur, comme Hypixel) ou spectator.
found-becomes: seeker

# Coeurs du chercheur (1.3.0) : il en a seeker-hearts une fois lache (max 10 = sa vie normale).
# Taper un vrai bloc du decor (pas un cacheur) coute wrong-hit-cost coeur(s) ; trouver un cacheur en rend found-heal.
# Pas de regeneration naturelle. A 0 coeur : seeker-respawn secondes dans la salle noire, puis retour avec tous ses coeurs.
seeker-hearts: 10
wrong-hit-cost: 1
found-heal: 2
seeker-respawn: 15
# Seule l'epee du chercheur touche un cacheur ou coute un coeur (1.3.1) : main nue ou autre objet = rien.
# Onde de choc (1.3.1, remplace la sonde) : clic droit avec la baguette de breeze, tous les cacheurs a
# shockwave-radius blocs ou moins (meme derriere un mur) sont deloges (plus solides) et un peu repousses.
shockwave-radius: 5.0
shockwave-cooldown: 15
# Radar : distance du cacheur le plus proche en mots, sans direction (Brulant < radar-burning < Chaud < radar-hot
# < Tiede < radar-warm < Froid).
radar-cooldown: 1
radar-burning: 10.0
radar-hot: 20.0
radar-warm: 35.0
# Bruits forces : chaque cacheur fait un petit bruit toutes les forced-sound-min a forced-sound-max secondes
# pendant la recherche (pas pendant la cachette). forced-sound-min: 0 = desactive.
forced-sound-min: 45
forced-sound-max: 60

# Toits et perchoirs (1.6.0, carte #135) : un cacheur ne peut pas se cacher sur les toits ni en hauteur a coups de sauts.
# Perchoir = le cacheur est a l'air libre (aucun bloc au-dessus de sa tete sur roof-cover-scan blocs ; feuilles et
# barrieres ne comptent pas) ET ses pieds sont a plus de max-roof-height blocs au-dessus du sol de la map a cet endroit
# (village : herbe y 64 ; port : quai, terrasse haute ou vase, ponts des bateaux ; supermarche : tout est couvert, donc
# gondoles et mezzanine restent permises). Etages, combles, mezzanines, escaliers et la galerie du phare restent permis.
# Sur un perchoir : impossible de devenir solide ; au bout de roof-return-delay secondes, retour au dernier point
# valide ou il etait au sol (sans degats). Ne concerne que les cacheurs. roof-block: false = regle coupee.
roof-block: true
max-roof-height: 3
roof-return-delay: 2.0
roof-cover-scan: 24

# Provocation (taunt) : son + particules, +1 point et le temps restant baisse de taunt-time-bonus secondes.
taunt-cooldown: 15
taunt-time-bonus: 5

# Dernieres secondes : les cacheurs emettent des particules et un son toutes les reveal-interval secondes.
final-reveal-time: 60
reveal-interval: 10

# Maps (1.5.0) : village (ci-dessous), port (Port de peche, zone de jeu x 352..433) et supermarche (x 800), toutes posees par
# le plugin dans le meme monde. Une map est tiree au hasard a chaque partie, jamais deux fois de suite.
# Liste des maps tirables (ids) ; vide = toutes. /hideseek map [id] (admin) impose la prochaine, /hideseek build [id].
# (La map EEMI de la 1.4.0 n'existe plus : sa zone est videe par la construction du port.)
maps: []
# Les maps port et supermarche ont leur propre liste de deguisement (decor fait de ces blocs). Pour la remplacer :
# map-blocks:
#   port:
#     BARREL: Tonneau

# Points du village (x,y,z[,yaw,pitch]) - correspondent a la map construite par le plugin.
waiting-spawn: 0.5,101,75.5,180,0
seeker-room: 0.5,101,-74.5,0,0
hider-spawn: 0.5,65,6.5,0,0
seeker-spawn: 0.5,65,-6.5,180,0

