# EemiStagiaires : stockage de 9 cases des stagiaires (AxMinions) et XP AuraSkills au retrait.
#
# AxMinions n'a pas d'inventaire propre : un stagiaire met ce qu'il produit dans le coffre relie,
# sinon il le jette au sol. Ce plugin donne a chaque stagiaire SANS coffre relie un stockage de
# "taille" cases. Quand il est plein, le stagiaire s'arrete (avertissement "coffre plein").
# Avec un coffre relie, AxMinions remplit le coffre comme avant (pas d'XP au retrait du coffre).
#
# Le stockage s'ouvre par le bouton "stockage" du menu du stagiaire (cle gui.items.stockage
# dans plugins/AxMinions/config.yml). On ne peut que retirer des objets, jamais en remettre.

taille: 9

# Part de l'XP qu'aurait gagnee le joueur en recoltant lui-meme les objets retires (0.4 = 40 %).
ratio-xp: 0.4

# Message dans la barre d'action au retrait (%xp%, %competence%). Vide = aucun message.
message-xp: "&a+%xp% XP %competence% &7(stagiaire)"

titre-stockage: "Stockage du stagiaire"

# Texte du bouton du menu AxMinions (%objets% = nombre d'objets, %cases% = cases occupees, %taille%)
bouton:
  nom: "&6&lStockage du stagiaire"
  lore:
    - ""
    - " &7- &fCases : &6%cases%/%taille%"
    - " &7- &fObjets : &6%objets%"
    - ""
    - "&6&l(!) &7Clique pour recuperer ce qu'il a produit."
    - "&7Retirer ses objets fait gagner de l'XP de metier."

# Types de stagiaires qui recoivent un stockage, et la competence AuraSkills gagnee au retrait.
# competence : mining, foraging, farming, fishing, fighting... ou "aucune".
# xp : XP qu'un joueur gagne en obtenant UN de ces objets lui-meme (valeurs tirees de
# plugins/AuraSkills/sources/*.yml, divisees par le nombre moyen d'objets par bloc / prise).
# Un objet absent de la liste ne donne pas d'XP. Le crafter et le seller ne sont pas listes :
# ils travaillent avec le coffre relie. Le slayer ne stocke rien (les butins tombent au sol).
types:
  miner:
    competence: mining
    xp:
      cobblestone: 0.2
      stone: 0.2
      andesite: 0.2
      diorite: 0.2
      granite: 0.2
      cobbled_deepslate: 0.4
      deepslate: 0.4
      coal: 1.0
      coal_ore: 1.0
      raw_iron: 1.8
      iron_ore: 1.8
      raw_copper: 1.0       # 3.5 par bloc, 2 a 5 minerais
      copper_ore: 3.5
      raw_gold: 17.8
      gold_ore: 17.8
      redstone: 1.3         # 5.9 par bloc, 4 a 5 poudres
      redstone_ore: 5.9
      lapis_lazuli: 4.7     # 30.6 par bloc, 4 a 9 lapis
      lapis_ore: 30.6
      diamond: 47.3
      diamond_ore: 47.3
      emerald: 100.0
      emerald_ore: 100.0
  lumber:
    competence: foraging
    xp:
      oak_log: 8.0
      spruce_log: 8.0
      birch_log: 8.0
      jungle_log: 8.0
      acacia_log: 8.0
      dark_oak_log: 8.0
      mangrove_log: 8.0
      cherry_log: 8.0
      pale_oak_log: 8.0
      crimson_stem: 10.0
      warped_stem: 12.0
  farmer:
    competence: farming
    xp:
      wheat: 3.0
      potato: 1.3           # 3.5 par plant, ~2,7 patates
      carrot: 1.3           # 3.5 par plant, ~2,7 carottes
      beetroot: 3.7
      nether_wart: 1.2      # 3.7 par plant, 2 a 4 verrues
      pumpkin: 4.0
      melon_slice: 0.8      # 4.0 par melon, 3 a 7 tranches
      melon: 4.0
      sugar_cane: 2.0
      cactus: 6.0
      cocoa_beans: 1.6      # 4.0 par cabosse, 2 a 3 feves
      bamboo: 0.25
      sweet_berries: 1.0
  fisher:
    competence: fishing
    xp:
      cod: 25
      salmon: 60
      tropical_fish: 750
      pufferfish: 115
      # dechets (categorie fishing_junk : 30)
      lily_pad: 30
      leather_boots: 30
      leather: 30
      bone: 30
      potion: 30
      string: 30
      fishing_rod: 30
      bowl: 30
      stick: 30
      ink_sac: 30
      tripwire_hook: 30
      rotten_flesh: 30
      bamboo: 30
      # tresors (categorie fishing_treasure : 1000)
      bow: 1000
      enchanted_book: 1000
      name_tag: 1000
      nautilus_shell: 1000
      saddle: 1000
  collector:
    # Le ramasseur prend tout ce qui est au sol, y compris ce que jettent les joueurs :
    # pas d'XP par defaut (sinon on gagnerait de l'XP en jetant des objets devant lui).
    competence: aucune
    xp: {}
