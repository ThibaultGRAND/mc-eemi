# EemiDropper - reserve de niveaux (releve hors ligne dans les fichiers des maps, 06/11/2026)
#
# Chaque niveau :
#   world        : monde de la map (importe tel quel)
#   name         : nom affiche
#   difficulty   : 1 (facile) a 5 (tres dur) ; une partie tire ses niveaux au hasard puis les range par difficulte
#   start        : [x, y, z, yaw, pitch] depart en haut du puits (sur la plateforme d'origine)
#   bounds       : [x1, y1, z1, x2, y2, z2] boite du puits (murs compris) ; en sortir = echec
#   finish       : liste de boites [x1, y1, z1, x2, y2, z2] de la zone d'arrivee au fond
#   finish-blocks: blocs d'arrivee (dans la boite) ; eau par defaut. Les blocs « sur lesquels on se pose »
#                  (slime_block, honey_block, hay_block) comptent sous les pieds, les autres dans le bloc des pieds.
#   night-vision : vision nocturne pendant le niveau (niveaux sombres de la map d'origine)
#   pumpkin      : citrouille sur la tete pendant le niveau (comme dans la map d'origine)
#   enabled      : false pour retirer un niveau sans l'effacer
#
# worlds.<monde>.command-blocks : blocs de commande de la map d'origine. Ils sont deja retires des zips
# prepares ; si un monde non nettoye est utilise, le plugin les remplace par de l'air au premier chargement.

