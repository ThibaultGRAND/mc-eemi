# Monde du ring (le lobby)
world: lobby
# Le combat ne tourne que si un joueur est a moins de ce rayon (blocs) du ring
radius: 40
# Volume des sons (1.0 = normal)
sound-volume: 0.6
# Temps entre deux echanges, en ticks (20 = 1 s), tire au hasard entre min et max
interval-min: 14
interval-max: 22
# Probabilites : bouclier leve a temps, coup critique, l'attaquant enchaine au lieu de laisser la main
block-chance: 0.4
crit-chance: 0.2
combo-chance: 0.25

# Les deux combattants se tournent automatiquement l'un vers l'autre.
# skin = pseudo Minecraft (vide = skin par defaut). Objets : noms de Material, vide = rien.
fighters:
