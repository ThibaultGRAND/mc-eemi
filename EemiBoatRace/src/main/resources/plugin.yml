name: EemiBoatRace
version: '${project.version}'
main: fr.eemicraft.boatrace.EemiBoatRace
api-version: '1.21'
softdepend: [Multiverse-Core]
description: Mario Barque, la course de bateaux facon Mario Kart d'EEMICRAFT (boites ?, objets, records)

commands:
  boatrace:
    description: Rejoindre ou gerer Mario Barque
    aliases: [course, br, mariobarque, kart]
    usage: /boatrace <join|leave|spectate [joueur]|record|start [n]|stop [n]|build|reload|parties>

permissions:
  eemiboatrace.admin:
    description: Commandes admin de la course de bateaux
    default: op
