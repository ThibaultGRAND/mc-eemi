# EemiBoatRace - course de bateaux sur glace d'EEMICRAFT.
# Circuit ferme en glace bleue construit par le plugin. Chaque joueur part dans un bateau depuis la
# grille de depart (cages ouvertes au feu vert). Il faut passer tous les points de controle dans
# l'ordre pour valider un tour (pas de raccourci). Le premier a finir les tours gagne ; les autres
# terminent leur course (voir finish-grace et last-racer-grace). Touche F ou objet "Revenir" = retour au dernier
# point de controle (aussi automatique hors piste, hors du bateau ou bloque).

# Monde du jeu : cree par le plugin (monde vide) s'il n'existe pas.
world: boatrace
# Monde du hub (retour par son point de spawn).
hub-world: lobby
# Heure fixe du monde (6000 = midi).
time: 6000

# ---------------------------------------------------------------- circuit
# Circuits importes (mondes importes tels quels avec /mv import <monde> normal) :
#   cosmic    Cosmic Cove (boat_cosmic), 3 tours
#   adventure The Adventure (boat_adventure), 1 tour de ~3 400 blocs
#   stadium   Mario Kart Stadium (boat_stadium), 3 tours
# « circuit » = circuit de la partie 1 au demarrage ; procedural = seulement l'ancien circuit construit
# par le plugin dans le monde « world » (reglages ci-dessous). Un circuit dont le monde manque est ignore.
circuit: cosmic
# Circuits utilises (absent = tous). Pris au redemarrage.
circuits: [cosmic, adventure, stadium]
# A la fin d'une course, la partie passe sur un autre circuit dont le monde est libre (joueurs emmenes).
rotation: true

# ---------------------------------------------------------------- circuit procedural (construit par le plugin)
# Hauteur de la glace. La ligne d'arrivee est en x 0, z 0 (depart vers +x).
floor-y: 100
# Hauteur du sol de la salle d'attente (au-dessus de la ligne de depart).
lobby-y: 140
# Largeur de la piste en blocs.
track-width: 7
# Echelle du trace (1.4 = environ 840 blocs par tour). Changer l'echelle ou la largeur change de
# record (un record par circuit) ; /boatrace build pour reconstruire.
track-scale: 1.4
# Marge de neige autour du trace.
ground-margin: 16
# Un drapeau tous les N blocs le long des murets.
flag-every: 12
# Chance d'un sapin par case de neige (loin de la piste).
tree-chance: 0.006
# Demi-longueur des tribunes de la ligne droite (x de -N a N).
stands-half-length: 30

# ---------------------------------------------------------------- course
min-players: 2
max-players: 12
# Decompte en salle d'attente (secondes), raccourci a full-countdown quand la course est pleine.
countdown: 20
full-countdown: 10
# Feux de depart : secondes dans les bateaux (cages fermees) avant le feu vert.
start-lights: 5
laps: 3
# Points de controle par tour (la ligne d'arrivee est le dernier).
checkpoints: 16
# Distance (blocs) entre la ligne et la premiere rangee de la grille.
grid-first: 4.5
# Temps laisse aux autres quand le premier a fini (secondes). 0 = aucun delai : chacun termine sa course
# (la course s'arrete quand tout le monde a fini, ou au bout de max-time).
finish-grace: 0
# Quand il ne reste qu'UN pilote en course (les autres ont fini), il a ce temps pour terminer (0 = jamais de limite
# avant max-time) : un pilote AFK ne bloque pas les autres.
last-racer-grace: 60
# Duree maximale de la course apres le feu vert (secondes).
max-time: 600
# Duree de l'ecran de fin avant le retour en salle d'attente.
end-time: 10

# ---------------------------------------------------------------- replacement automatique
# Bloque : moins de stuck-min-distance blocs gagnes pendant stuck-seconds secondes (0 = jamais).
stuck-seconds: 10
stuck-min-distance: 3.0
# Hors piste : bateau a plus de (largeur/2 + off-track-margin) blocs de la ligne mediane.
off-track-margin: 2.5
# Tombe : bateau plus bas que floor-y - fall-depth.
fall-depth: 3
# Delai minimal entre deux retours demandes (touche F / objet), en secondes.
respawn-cooldown: 2.0

# ---------------------------------------------------------------- bateaux
# Types de bateaux donnes tour a tour aux joueurs (noms d'entites Minecraft).
boat-types: [OAK_BOAT, SPRUCE_BOAT, BIRCH_BOAT, JUNGLE_BOAT, ACACIA_BOAT, DARK_OAK_BOAT, MANGROVE_BOAT, CHERRY_BOAT, PALE_OAK_BOAT, BAMBOO_RAFT]

# ---------------------------------------------------------------- parties en parallele
# Partie 1 = le monde du circuit (boat_cosmic, ou world pour le procedural), parties 2.. = copies
# <monde>_2, <monde>_3... faites depuis le modele propre <monde>_modele (copie au demarrage et apres
# /boatrace build). Absent = 3.
max-instances: 3

# ---------------------------------------------------------------- mode Mario Kart (2.3.0)
# Boites ? sur le circuit : passer dedans donne un objet (roulette), clic droit ou Q pour l'utiliser.
# Les objets sont tires selon la place : le premier a surtout des objets faibles, les derniers les forts.
kart:
  enabled: true
  # Une rangee de boites tous les N blocs de circuit (entre min-boxes et max-boxes rangees).
  box-spacing: 220
  min-boxes: 3
  max-boxes: 16
  # Decalage lateral des boites d'une rangee (blocs, par rapport au milieu de la piste).
  box-lateral: [-2.5, 0.0, 2.5]
  box-scale: 2.5
  # Secondes avant qu'une boite prise reapparaisse.
  box-respawn: 3.0
  # Duree de la roulette (secondes).
  roulette: 1.5
  # Durees des effets (secondes).
  boost-time: 1.5
  turbo-time: 10.0
  star-time: 5.0
  ink-time: 3.0
  lightning-stun: 1.5
  banana-stun: 1.25
  snowball-stun: 1.25
  banana-life: 60.0
  # Vitesses (blocs par tick) : champignon, etoile, vitesse minimale du turbo, plafond.
  boost-speed: 1.8
  star-speed: 1.5
  turbo-min-speed: 0.8
  max-speed: 2.6
  snowball-speed: 2.4
  # Poids de tirage [premier, dernier] (interpoles selon la place ; l'eclair n'est jamais donne au 1er).
  weights:
    champignon: [30, 15]
    banane: [35, 4]
    neige: [25, 10]
    encre: [5, 20]
    # turbo maitrise retire du jeu (jamais tire, meme avec un poids)
    turbo: [0, 0]
    eclair: [0, 18]
    etoile: [2, 12]
