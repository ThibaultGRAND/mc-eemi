# Dernier Refuge : tables de butin des expéditions (CONCEPTION 6.2).
# Copié dans plugins/EemiRefuge/loot.yml au premier démarrage ; relu par /refuge expe reload.
#
# Chaque support marqué de la zone (x,y,z,type,piece) est vidé puis rempli au départ de l'expédition
# avec la table de sa pièce. objet = id du Catalogue (bandage, conserve...) ou matériau vanilla (minecraft:bread).
# rarete = commun | peu_commun | rare | epique | legendaire (par défaut : la couleur du Catalogue, sinon commun).
# acte = acte minimal de la zone (la Bourgade est l'acte 2), acte-max = acte maximal.
# Un id inconnu est ignoré (un seul avertissement dans la console) : les plans (plan_*) arriveront avec la progression.

# Poids du cran de rareté tiré pour chaque case.
raretes:
  commun: 60
  peu_commun: 26
  rare: 10
  epique: 3
  legendaire: 1
# La nuit, un cran de rareté en plus.
nuit-bonus: 1
# Part des cases tirées laissées vides (« déjà pillé »).
vide: 0.4
# Nombre de cases tirées par conteneur (avant le tirage du vide).
objets-par-conteneur:
  min: 2
  max: 5
# Nombre de cases tirées pour certains types de supports (étagère : 3 cases, pot : 1).
# Les fours (four, fumoir, haut_fourneau) reçoivent au plus un objet, dans la case du résultat.
tirages-par-type:
  shelf: 3
  decorated_pot: 1
  chiseled_bookshelf: 2

# Pièces sans table propre → table utilisée (sinon « defaut »).
# Pièces de la Bourgade (zones/bourgade_containers.yml) : salon, maison, cuisine, bureau, garage, salle_de_bain.
# Les noms crate_* sont ceux des caisses de la map Mosslorn.
