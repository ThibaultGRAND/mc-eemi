# EemiSoleil 2.0 - Squid Game (id EemiCore "soleil", commande /soleil, /squidgame, /squid)
# Une partie = les epreuves de la saison 1 dans l'ordre de la serie, puis une finale en 1 contre 1.
# Toutes les cles ont aussi une valeur par defaut dans le code (un config ancien sans ces cles fonctionne).

world: soleil

partie:
  # Lancement automatique a partir de min-joueurs (admin : /soleil start des 2 joueurs)
  min-joueurs: 4
  max-joueurs: 16
  # Secondes au dortoir entre deux epreuves (annonce, regles, tirelire) ; /soleil passer pour ecourter
  entracte: 25
# Decompte (secondes) une fois le minimum atteint (5 s si la partie est pleine)
countdown: 20

# Programme : nombre minimal de joueurs AU DEPART de la partie pour jouer l'epreuve
# (par defaut : 3 -> pont ; 4-5 -> soleil, pont ; 6-7 -> soleil, dalgona, billes, pont ; 8+ -> les 5).
# Une epreuve est aussi sautee si, au moment de la jouer, il reste moins de 3 joueurs (4 pour la corde).
programme:
  soleil: 4
  dalgona: 6
  corde: 8
  billes: 6
  pont: 3

# Eliminations par epreuve, en % des joueurs EN JEU au debut de l'epreuve (min arrondi au-dessus, max au-dessous).
# Au-dela du max : eliminations annulees (gracie). Sous le min : departage des moins bons.
# Il reste toujours au moins 2 joueurs ; la derniere epreuve avant la finale en laisse exactement 2.
elimination:
  soleil: {min: 0, max: 60}
  dalgona: {min: 0, max: 50}
  corde: {min: 25, max: 60}
  billes: {min: 25, max: 60}
  pont: {min: 0, max: 100}

# Gros lot du grand gagnant (pieces EemiCore) : base + par-elimine x (joueurs - 1)
recompense:
  base: 300
  par-elimine: 50

# Textures du pack EEMICRAFT (tenues numerotees, gardes masques, aiguille, biscuit, billes, couteau...).
# false tant que le pack avec les fichiers squid/ n'est pas publie (sinon objets violet et noir).
textures: false

# Construction des zones etalee sur plusieurs ticks (blocs poses par tick)
construction:
  blocs-par-tick: 40000

# ---------------------------------------------------------------- 1, 2, 3 Soleil
intro: 5
time-limit: 150
chant-min: 1.5
chant-max: 5.0
fast-chance: 0.15
fast-min: 0.7
fast-max: 1.3
look-min: 2.0
look-max: 4.0
turn-time: 0.5
grace: 0.3
move-threshold: 0.15
jump-threshold: 0.3
pushing: true
push-strength: 0.55
push-up: 0.25
push-cooldown: 600

# ---------------------------------------------------------------- Biscuit dalgona
dalgona:
  choix: 15
  temps: 90
  # portee de clic (blocs) pendant la decoupe (le biscuit fait 11 x 11)
  portee: 10
  fissures: {rond: 3, triangle: 3, etoile: 2, parapluie: 2}

# ---------------------------------------------------------------- Tir a la corde
corde:
  temps: 60
  # distance (blocs) a gagner pour faire tomber l'autre equipe
  victoire: 6.0
  # deplacement de la corde par clic (2.0.2 : tirage au spam, celui qui clique le plus vite gagne)
  pas: 0.05
  # plafond de clics comptes par seconde et par joueur (20 = aucun plafond reel)
  clics-max-par-seconde: 20

# ---------------------------------------------------------------- Billes
billes:
  depart: 10
  decision: 15
  temps: 180

# ---------------------------------------------------------------- Pont de verre
pont:
  choix: 15
  temps-tour: 45
  temps: 420

# ---------------------------------------------------------------- Finale du calamar
finale:
  temps: 150
  recul: 0.9
  recul-haut: 0.35

# La poupee : entite Mannequin agrandie (attribut scale, 1 = taille d'un joueur, 16 maximum)
doll:
  scale: 3.8
  red-eyes: true
  laser: true
  texture: ""
  signature: ""

# Retour au hub en fin de partie
hub:
  world: lobby
  x: 722.5
  y: 51
  z: 650.5
  yaw: 90
  pitch: 0

# Mondes depuis lesquels on peut rejoindre (vide = partout)
join-from: [lobby]
eemicore-id: soleil
